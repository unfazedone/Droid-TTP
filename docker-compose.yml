# ==============================================================================
# DroidTTP - Self-Hosted Production Stack
# Fast, Secure Android CTI Workbench with Nginx Reverse Proxy
# ==============================================================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: droidttp-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DROIDTTP_DATA_DIR=/app/data
      - DROIDTTP_COOKIE_SECURE=true
    volumes:
      - droidttp-data:/app/data
    networks:
      - droidttp-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    cpus: 2.0
    depends_on:
      worker:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/healthz"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: droidttp-worker
    restart: unless-stopped
    command: ["python", "-m", "app.queue_worker"]
    environment:
      - DROIDTTP_PROCESS_ROLE=worker
      - DROIDTTP_DATA_DIR=/app/data
      - DROIDTTP_ANALYSIS_TIMEOUT_SECONDS=${DROIDTTP_ANALYSIS_TIMEOUT_SECONDS:-90}
    volumes:
      - droidttp-data:/app/data
    networks:
      - analysis-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    pids_limit: 64
    mem_limit: 768m
    cpus: 1.0

  nginx:
    image: nginx:1.27-alpine
    container_name: droidttp-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - droidttp-net
    depends_on:
      web:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M

networks:
  droidttp-net:
    driver: bridge
  analysis-net:
    driver: bridge
    internal: true

volumes:
  droidttp-data:
    driver: local
