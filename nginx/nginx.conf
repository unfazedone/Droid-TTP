# ==============================================================================
# DroidTTP - Main Nginx Configuration
# Hardened Reverse Proxy for Cyber Threat Intelligence Workbench
# ==============================================================================

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format with security attributes
    log_format cti_combined '$remote_addr - $remote_user [$time_local] '
                            '"$request_method $request_uri $server_protocol" '
                            '$status $body_bytes_sent "$http_referer" '
                            '"$http_user_agent" rt=$request_time';

    access_log /var/log/nginx/access.log cti_combined;

    # Performance and buffer tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip compression for static files and reports
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Include modular server configurations
    include /etc/nginx/conf.d/*.conf;
}
