# ==============================================================================
# DroidTTP - Virtual Host Configuration
# Reverse Proxy with TLS Termination, Security Headers & Large File Handling
# ==============================================================================

# Rate limiting zones to protect against brute force and resource exhaustion
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

upstream droidttp_backend {
    server web:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# HTTP Server: Redirect all traffic to HTTPS (except local health checks)
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Allow local container / orchestrator health probes over plain HTTP
    location /healthz {
        proxy_pass http://droidttp_backend/healthz;
        proxy_set_header Host $host;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server: Hardened Production Interface
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # TLS Certificates (Mounted from ./nginx/certs)
    ssl_certificate /etc/nginx/certs/droidttp.crt;
    ssl_certificate_key /etc/nginx/certs/droidttp.key;

    # Modern TLS Security Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Upload size allowance for Android APKs (configurable up to 250 MB)
    client_max_body_size 250M;
    client_body_buffer_size 1M;
    client_body_timeout 180s;

    # Global Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; frame-ancestors 'none'; form-action 'self';" always;

    # Rate limiting on authentication endpoint
    location = /api/login {
        limit_req zone=login_limit burst=3 nodelay;
        proxy_pass http://droidttp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # APK Upload and Long Analysis Jobs
    location ~* ^/api/cases/.+/samples$ {
        limit_conn conn_limit 5;
        proxy_pass http://droidttp_backend;
        proxy_http_version 1.1;
        proxy_request_buffering off; # Stream upload directly to backend
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Standard Application and API Routes
    location / {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://droidttp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Health Checks
    location /healthz {
        proxy_pass http://droidttp_backend/healthz;
        access_log off;
    }

    location /readyz {
        proxy_pass http://droidttp_backend/readyz;
        access_log off;
    }
}
